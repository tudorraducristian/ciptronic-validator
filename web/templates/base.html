<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Ciptronic Product Validator{% endblock %}</title>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <link rel="stylesheet" href="/static/styles.css?v=13">
</head>
<body>
    <header class="topbar">
        <div class="topbar__inner">
            <a class="brand" href="/">
                <span class="brand__mark">C</span>
                Ciptronic Validator
            </a>
            <span class="topbar__meta">{% block topbar_meta %}{% endblock %}</span>
        </div>
    </header>
    {% block content %}{% endblock %}
    <script>
        // Show a preview of any chosen image in the sibling .upload-slot__img.
        // Delegated so it also covers htmx-swapped content.
        document.addEventListener('change', function (e) {
            var input = e.target;
            if (!input.matches || !input.matches('input[type=file]')) return;
            var img = input.parentElement && input.parentElement.querySelector('.upload-slot__img');
            if (!img) return;
            if (img.dataset.url) { URL.revokeObjectURL(img.dataset.url); }
            var file = input.files && input.files[0];
            if (file) {
                var url = URL.createObjectURL(file);
                img.src = url;
                img.dataset.url = url;
                img.hidden = false;
                var box = input.closest('.upload-slot');
                if (box) { box.classList.add('upload-slot--filled'); }
            } else {
                img.hidden = true;
                img.removeAttribute('src');
            }
        });

        // Block double-submit on the slow LLM forms (analyze_sim ~10s,
        // compare_real ~15s): lock the submit button once the form is on its
        // way. Skip HTMX-driven forms — HTMX manages its own request lifecycle.
        document.addEventListener('submit', function (e) {
            var form = e.target;
            if (!form || form.tagName !== 'FORM') return;
            if (form.hasAttribute('hx-post') || form.hasAttribute('hx-get') ||
                form.querySelector('[hx-post],[hx-get]')) return;
            var btn = form.querySelector('button[type=submit], button:not([type])');
            if (!btn || btn.disabled) return;
            btn.textContent = 'Se procesează…';
            // Disable after the native submission is dispatched, so the form
            // still posts normally.
            setTimeout(function () { btn.disabled = true; }, 0);
        });
    </script>
</body>
</html>
